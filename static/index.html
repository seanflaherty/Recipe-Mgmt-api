<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Management Dashboard</title>

    <!-- 1. Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. HTMX CDN with integrity check -->
    <script src="https://unpkg.com/htmx.org@1.9.12"
        integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc09BN2XoEG1ffH0W1TIFGBBvP3aiF32FkIF"
        crossorigin="anonymous"></script>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen p-6">

    <div class="max-w-4xl mx-auto space-y-8">
        <!-- Header -->
        <header class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h1 class="text-3xl font-bold text-emerald-600">🍳 Recipe Manager</h1>
            <p class="text-gray-500 text-sm mt-1">Powered by FastAPI, Tailwind, and HTMX</p>
        </header>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

            <!-- Section: Add Recipe Form -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Add a New Recipe</h2>

                <form id="recipe-form" onsubmit="submitRecipe(event)" class="space-y-4">
                    <!-- Recipe Name -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Recipe Name</label>
                        <input type="text" id="recipe-name" placeholder="e.g. Homemade Bread" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                    </div>

                    <!-- Ingredient Details -->
                    <div class="border-t pt-3 space-y-3">
                        <h3 class="text-sm font-semibold text-gray-700">Main Ingredient</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-medium text-gray-500 mb-1">Ingredient Name</label>
                                <input type="text" id="ing-name" placeholder="e.g. Flour" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-500 mb-1">Dietary Tags
                                    (comma-separated)</label>
                                <input type="text" id="ing-tags" placeholder="e.g. VEGAN, GLUTEN"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-medium text-gray-500 mb-1">Quantity</label>
                                <input type="number" step="0.1" id="ing-quantity" value="1.0" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-500 mb-1">Unit</label>
                                <input type="text" id="ing-unit" placeholder="e.g. cups"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                            </div>
                        </div>
                    </div>

                    <!-- Instruction Details -->
                    <div class="border-t pt-3 space-y-3">
                        <h3 class="text-sm font-semibold text-gray-700">First Instruction Step</h3>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Description</label>
                            <input type="text" id="ins-description" placeholder="e.g. Mix ingredients in a bowl."
                                required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Prep Time (minutes)</label>
                            <input type="number" id="ins-prep-time" value="5" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                        </div>
                    </div>

                    <button type="submit"
                        class="w-full bg-emerald-600 text-white font-medium py-2 px-4 rounded-lg hover:bg-emerald-700 transition text-sm">
                        Save Recipe to Database
                    </button>
                </form>

                <!-- Feedback target container -->
                <div id="result-message" class="mt-4 text-sm"></div>
            </section>

            <!-- Section: Recipe List -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-700">Recipe Book</h2>

                    <!-- Refresh List Button powered by HTMX -->
                    <button hx-get="/recipes-db" hx-target="#recipe-list-container" hx-swap="innerHTML"
                        class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg transition">
                        Refresh List
                    </button>
                </div>

                <!-- HTMX GET trigger on page load -->
                <div id="recipe-list-container" hx-get="/recipes-db" hx-trigger="load" hx-swap="innerHTML"
                    class="text-gray-500 italic text-sm">
                    Loading recipes from database...
                </div>
            </section>

        </div>
    </div>

    <!-- Recipe Details Modal (Pop-up Window) -->
    <div id="recipe-modal"
        class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 space-y-4 shadow-xl relative">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modal-title" class="text-xl font-bold text-emerald-700">Recipe Details</h3>
                <button onclick="closeRecipeModal()"
                    class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
            </div>

            <div id="modal-content" class="space-y-4 text-sm text-gray-600 max-h-96 overflow-y-auto">
                <!-- Populated dynamically via JS -->
            </div>

            <div class="flex justify-end pt-3 border-t">
                <button onclick="closeRecipeModal()"
                    class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-300 transition">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- Script to handle form submission and recipe modal pop-up -->
    <script>
        async function submitRecipe(event) {
            event.preventDefault();

            const name = document.getElementById('recipe-name').value;
            const ingName = document.getElementById('ing-name').value;
            const ingTagsRaw = document.getElementById('ing-tags').value;
            const dietaryTags = ingTagsRaw ? ingTagsRaw.split(',').map(t => t.trim()).filter(t => t.length > 0) : [];
            const quantity = parseFloat(document.getElementById('ing-quantity').value);
            const unit = document.getElementById('ing-unit').value;

            const description = document.getElementById('ins-description').value;
            const prepTime = parseInt(document.getElementById('ins-prep-time').value, 10);

            const payload = {
                name: name,
                recipe_ingredients: [
                    {
                        ingredient: {
                            name: ingName,
                            dietary_tags: dietaryTags
                        },
                        quantity: quantity,
                        unit: unit
                    }
                ],
                instructions: [
                    {
                        description: description,
                        prep_time: prepTime,
                        equipment: [],
                        include_in_prep_time: true
                    }
                ]
            };

            try {
                const response = await fetch('/recipes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const resultDiv = document.getElementById('result-message');

                if (response.ok) {
                    resultDiv.innerHTML = `<div class='p-3 bg-emerald-50 text-emerald-700 rounded-lg border border-emerald-200 text-xs'>${result.message}</div>`;

                    // Refresh recipe list
                    const listResponse = await fetch('/recipes-db');
                    const listHtml = await listResponse.text();
                    document.getElementById('recipe-list-container').innerHTML = listHtml;

                    document.getElementById('recipe-form').reset();
                } else {
                    resultDiv.innerHTML = `<div class='p-3 bg-red-50 text-red-700 rounded-lg border border-red-200 text-xs'>Error: ${result.detail || 'Failed to save'}</div>`;
                }
            } catch (err) {
                document.getElementById('result-message').innerHTML = `<div class='p-3 bg-red-50 text-red-700 rounded-lg border border-red-200 text-xs'>Network error: ${err.message}</div>`;
            }
        }

        // Functions to open and populate the modal with recipe details
        function openRecipeModal(button) {
            const modal = document.getElementById('recipe-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalContent = document.getElementById('modal-content');

            // Parse the JSON data embedded in the button's data-recipe attribute
            const recipeData = JSON.parse(button.getAttribute('data-recipe'));

            modalTitle.innerText = recipeData.name;

            // Build ingredients list HTML
            let ingredientsHtml = '<h4 class="font-semibold text-gray-700 mt-2">Ingredients:</h4><ul class="list-disc list-inside space-y-1 text-sm">';
            if (recipeData.ingredients && recipeData.ingredients.length > 0) {
                recipeData.ingredients.forEach(ing => {
                    const tags = ing.dietary_tags && ing.dietary_tags.length > 0 ? ` <span class="text-xs bg-emerald-50 text-emerald-600 px-1.5 py-0.5 rounded">${ing.dietary_tags.join(', ')}</span>` : '';
                    ingredientsHtml += `<li>${ing.quantity} ${ing.unit} ${ing.name}${tags}</li>`;
                });
            } else {
                ingredientsHtml += '<li class="text-gray-400 italic">No ingredients listed.</li>';
            }
            ingredientsHtml += '</ul>';

            // Build instructions list HTML
            let instructionsHtml = '<h4 class="font-semibold text-gray-700 mt-4">Instructions:</h4><ol class="list-decimal list-inside space-y-2 text-sm">';
            if (recipeData.instructions && recipeData.instructions.length > 0) {
                recipeData.instructions.forEach(ins => {
                    instructionsHtml += `<li>${ins.description} <span class="text-xs text-gray-400">(Prep: ${ins.prep_time} mins)</span></li>`;
                });
            } else {
                instructionsHtml += '<li class="text-gray-400 italic">No instructions listed.</li>';
            }
            instructionsHtml += '</ol>';

            // Render inside modal content container
            modalContent.innerHTML = `
        <p class="text-sm"><strong>Total Prep Time:</strong> ${recipeData.total_prep_time} minutes</p>
        ${ingredientsHtml}
        ${instructionsHtml}
    `;

            // Show the modal
            modal.classList.remove('hidden');
        }

        function closeRecipeModal() {
            document.getElementById('recipe-modal').classList.add('hidden');
        }

        // Function to fetch and render the recipe list
        async function loadRecipes() {
            const container = document.getElementById('recipe-list-container');
            container.innerHTML = "<p class='text-gray-400 italic text-sm'>Loading recipes from database...</p>";

            try {
                const response = await fetch('/recipes-db');
                const htmlContent = await response.text();
                container.innerHTML = htmlContent;
            } catch (err) {
                container.innerHTML = `<p class='text-red-500 text-xs'>Failed to load recipes: ${err.message}</p>`;
            }
        }

        // Automatically load recipes when the page loads
        window.addEventListener('DOMContentLoaded', loadRecipes);

    </script>
</body>

</html>
