<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Management Dashboard</title>

    <!-- 1. Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.12"
        integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc09BN2XoEG1ffH0W1TIFGBBvP3aiF32FkIF"
        crossorigin="anonymous"></script>

    <!-- 3. HTMX JSON Encoding Extension (Optional, useful if posting raw JSON to your API) -->
    <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen p-6">

    <div class="max-w-4xl mx-auto space-y-8">
        <!-- Header -->
        <header class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h1 class="text-3xl font-bold text-emerald-600">🍳 Recipe Manager</h1>
            <p class="text-gray-500 text-sm mt-1">Powered by FastAPI/Connexion, Tailwind, and HTMX</p>
        </header>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

            <!-- Section: Add Recipe Form -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Add a New Recipe (JSON)</h2>

                <!-- HTMX Form POST with JSON encoding extension -->
                <form hx-post="http://127.0.0.1:8000/recipes" hx-ext="json-enc" hx-target="#result-message"
                    hx-swap="innerHTML" class="space-y-4">

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Recipe JSON Payload</label>
                        <p class="text-xs text-gray-400 mb-2">Paste or write the recipe structure matching your schema.
                        </p>

                        <textarea name="recipe_payload" rows="10" required
                            class="w-full font-mono text-xs px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">{
  "name": "Homemade Bread",
  "recipe_ingredients": [
    {
      "ingredient": {
        "name": "Flour",
        "dietary_tags": ["VEGAN"]
      },
      "quantity": 3.0,
      "unit": "cups"
    }
  ],
  "instructions": [
    {
      "description": "Mix flour and water in a bowl.",
      "prep_time": 10,
      "equipment": ["mixing bowl"],
      "include_in_prep_time": true
    }
  ]
}</textarea>
                    </div>

                    <button type="submit"
                        class="w-full bg-emerald-600 text-white font-medium py-2 px-4 rounded-lg hover:bg-emerald-700 transition">
                        Save Recipe to Database
                    </button>
                </form>

                <!-- Feedback target container -->
                <div id="result-message" class="mt-4 text-sm"></div>
            </section>

            <!-- Section: Recipe List -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-700">Recipe Book</h2>
                    <!-- Optional: Refresh button to manually reload recipes via HTMX -->
                    <button hx-get="http://127.0.0.1:8000/recipes-db" hx-target="#recipe-list-container"
                        hx-swap="innerHTML"
                        class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg transition">
                        Refresh List
                    </button>
                </div>

                <!-- HTMX GET trigger on page load -->
                <div id="recipe-list-container" hx-get="http://127.0.0.1:8000/recipes-db" hx-trigger="load"
                    hx-swap="innerHTML" class="text-gray-500 italic">
                    Loading recipes from database...
                </div>
            </section>

        </div>
    </div>

</body>

</html>
